spring:
  application:
    name: order-monolith-refactor

  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Pricing rules - previously magic numbers inline in the controller.
pricing:
  tax-rate: 0.08
  free-shipping-threshold: 100.00
  standard-shipping-fee: 9.99
  coupons:
    SAVE5: 0.05

# Payment integration config. Secrets come from the environment, not this file.
payment:
  base-url: https://api.paymentservice.com/v1/charge
  # true for local/dev: skip the (non-existent) gateway and return a synthetic
  # reference. Set false where a real outage must surface as HTTP 502.
  fake-approvals: true
  stripe-api-key: ${STRIPE_API_KEY:}
  paypal-api-key: ${PAYPAL_API_KEY:}

logging:
  level:
    com.example.ordermonolith: DEBUG
