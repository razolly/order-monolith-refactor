# The Gradle daemon itself must run on a JDK that the current Gradle version supports.
# This machine ships JDK 26, which Gradle 8.10.x cannot run on, so we pin the daemon
# to the locally installed Amazon Corretto 21. Adjust or remove this line if your
# JAVA_HOME already points at a Java 17/21 JDK.
org.gradle.java.home=/Users/razli/Library/Java/JavaVirtualMachines/corretto-21.0.10/Contents/Home

org.gradle.caching=true
org.gradle.parallel=true
